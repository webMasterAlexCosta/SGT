# =============================================================================
# PONTE SPRING BOOT -> .env
#
# Os valores do ambiente ficam exclusivamente no arquivo .env.
# ENV_FILE pode apontar para outro arquivo (variável do sistema operacional).
# O import é opcional para permitir compilação/testes sem segredos locais;
# na execução normal, placeholders obrigatórios impedem inicialização incompleta.
# =============================================================================
spring.config.import=optional:file:${env-file:./.env}[.properties]

spring.application.name=${APP_NAME}
spring.datasource.driver-class-name=${DB_DRIVER}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT_MS}
spring.datasource.hikari.pool-name=${DB_POOL_NAME}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.sql.init.mode=never
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW}
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL}
spring.jpa.properties.hibernate.jdbc.batch_size=${JPA_BATCH_SIZE:100}
spring.jpa.properties.hibernate.default_batch_fetch_size=${JPA_DEFAULT_BATCH_FETCH_SIZE:100}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.jdbc.time_zone=${TIMEZONE_PADRAO}
server.address=${SERVER_ADDRESS}
server.port=${SERVER_PORT}
server.ssl.enabled=${SSL_ENABLED}
server.ssl.key-store=${SSL_KEY_STORE}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD}
server.ssl.key-store-type=${SSL_KEY_STORE_TYPE}
server.ssl.key-alias=${SSL_KEY_ALIAS}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
app.security.autenticar.max-attempts=${LOGIN_MAX_ATTEMPTS}
app.security.autenticar.block-duration-ms=${LOGIN_BLOCK_DURATION_MS}
autenticar.attempt.cleanup-rate-ms=${LOGIN_ATTEMPT_CLEANUP_RATE_MS}
app.security.jwt.max-inactivity-minutes=${JWT_MAX_INACTIVITY_MINUTES}
app.security.jwt.update-interval-seconds=${JWT_UPDATE_INTERVAL_SECONDS}
app.security.jwt.cache-ttl-ms=${JWT_CACHE_TTL_MS}
app.security.jwt.cache-cleanup-ms=${JWT_CACHE_CLEANUP_MS}
app.security.jwt.cleanup.cron=${JWT_CLEANUP_CRON}
app.security.jwt.cleanup.batch-size=${JWT_CLEANUP_BATCH_SIZE}
jwt.cleanup.retry-attempts=${JWT_CLEANUP_RETRY_ATTEMPTS}
jwt.cleanup.retry-delay-ms=${JWT_CLEANUP_RETRY_DELAY_MS}
app.security.2fa.period-seconds=${TOTP_PERIOD_SECONDS}
app.ratelimit.capacity=${RATE_LIMIT_CAPACITY}
app.ratelimit.duration-seconds=${RATE_LIMIT_DURATION_SECONDS}
app.ratelimit.cleanup-rate-ms=${RATELIMIT_CLEANUP_RATE_MS}
app.ratelimit.timeout-ms=${RATELIMIT_TIMEOUT_MS}
file.upload-dir=${FILE_UPLOAD_DIR}
app.upload.max-file-size-bytes=${UPLOAD_MAX_FILE_SIZE_BYTES}
app.upload.max-total-bytes=${UPLOAD_MAX_TOTAL_BYTES}
app.upload.max-files-per-request=${UPLOAD_MAX_FILES}
frequencia.max-range-days=${FREQUENCIA_MAX_RANGE_DAYS}
frequencia.max-batch-size=${FREQUENCIA_MAX_BATCH_SIZE:1000}
ocorrencia.max-period-days=${OCORRENCIA_MAX_PERIOD_DAYS}
auth.password-min-length=${AUTH_PASSWORD_MIN_LENGTH}
auth.device-cookie-max-age-seconds=${AUTH_DEVICE_COOKIE_MAX_AGE_SECONDS}
auth.generic-error=${AUTH_GENERIC_ERROR}
appuser.retroactive-unlock-hours=${APPUSER_RETROACTIVE_UNLOCK_HOURS}
appuser.retroactive-unlock-days=${APPUSER_RETROACTIVE_UNLOCK_DAYS}
empregado.max-jornada-minutes=${EMPREGADO_MAX_JORNADA_MINUTES}
audit.secret=${AUDIT_SECRET}
audit.fallback-log=${AUDIT_FALLBACK_LOG}
audit.payload.max-bytes=${AUDIT_PAYLOAD_MAX_BYTES}
audit.sensitive-fields-regex=${AUDIT_SENSITIVE_FIELDS_REGEX}
auditlog.queue.capacity=${AUDITLOG_QUEUE_CAPACITY}
auditlog.flush.batch-size=${AUDITLOG_FLUSH_BATCH_SIZE}
auditlog.flush.delay-ms=${AUDITLOG_FLUSH_DELAY_MS}
auditlog.flush.retry-attempts=${AUDITLOG_FLUSH_RETRY_ATTEMPTS}
auditlog.flush.retry-delay-ms=${AUDITLOG_FLUSH_RETRY_DELAY_MS}
sistema.manutencao=${SISTEMA_MANUTENCAO}
sistema.previsao-retorno=${SISTEMA_PREVISAO_RETORNO}
# Cargas que alteram dados ficam desabilitadas por padrão. Ative apenas de forma consciente.
# Quando true, cada etapa concluída grava um marcador interno no banco e é
# automaticamente ignorada nas próximas inicializações. Para reaplicar uma
# carga deliberadamente, use false apenas durante aquela execução.
app.seed.executar-apenas-uma-vez=${APP_SEED_EXECUTAR_APENAS_UMA_VEZ:true}
# Carga idempotente das lotações CTCE, CTE e TECA. Na segunda inicialização,
# as unidades já existentes são apenas ignoradas.
app.seed.unidades-operacionais-enabled=${APP_SEED_UNIDADES_OPERACIONAIS_ENABLED:true}
# Jornadas operacionais padrão para uma instalação nova.
app.seed.jornadas-operacionais-enabled=${APP_SEED_JORNADAS_OPERACIONAIS_ENABLED:true}
# Contas iniciais exigem ativação explícita e senha exclusiva de instalação.
app.seed.usuarios-globais-enabled=${APP_SEED_USUARIOS_GLOBAIS_ENABLED:false}
app.seed.usuarios-globais-initial-password=${APP_SEED_USUARIOS_GLOBAIS_INITIAL_PASSWORD:}
# Cria, de forma idempotente, um usuário de SE e um usuário de GestaoLocal para
# cada UF. A senha é trocada obrigatoriamente no primeiro acesso.
app.seed.gestores-se-gestao-local-enabled=${APP_SEED_GESTORES_SE_GESTAO_LOCAL_ENABLED:false}
app.seed.gestores-initial-password=${APP_SEED_GESTORES_INITIAL_PASSWORD:}
spring.jackson.serialization.fail-on-empty-beans=${JACKSON_FAIL_ON_EMPTY_BEANS}
spring.jackson.time-zone=${TIMEZONE_PADRAO}
spring.jackson.date-format=${JACKSON_DATE_FORMAT}
logging.level.org.hibernate.orm.jdbc.bind=${LOG_HIBERNATE_BIND}
logging.level.com.example.siggtrat=${LOG_APPLICATION}
logging.level.org.springframework.security=${LOG_SPRING_SECURITY}
logging.level.org.springframework.web=${LOG_SPRING_WEB}

# Fechamento assíncrono de frequência (sem Redis). O MySQL persiste a fila,
# o cursor e o progresso; o executor dedicado limita a pressão sobre o banco.
frequencia.fechamento.chunk-size=${FREQUENCIA_FECHAMENTO_CHUNK_SIZE:500}
frequencia.fechamento.max-alteracoes=${FREQUENCIA_FECHAMENTO_MAX_ALTERACOES:25000}
frequencia.fechamento.executor-core-pool-size=${FREQUENCIA_FECHAMENTO_EXECUTOR_CORE:1}
frequencia.fechamento.executor-max-pool-size=${FREQUENCIA_FECHAMENTO_EXECUTOR_MAX:1}
frequencia.fechamento.executor-queue-capacity=${FREQUENCIA_FECHAMENTO_EXECUTOR_QUEUE:100}
frequencia.fechamento.recovery-delay-ms=${FREQUENCIA_FECHAMENTO_RECOVERY_DELAY_MS:30000}
frequencia.fechamento.stale-after-seconds=${FREQUENCIA_FECHAMENTO_STALE_AFTER_SECONDS:300}

# Painel gerencial assíncrono e cache persistido
app.painel.cache-minutos=${PAINEL_CACHE_MINUTOS:10}
app.painel.timeout-minutos=${PAINEL_TIMEOUT_MINUTOS:30}
app.painel.recuperacao-intervalo-ms=${PAINEL_RECUPERACAO_INTERVALO_MS:30000}

# =============================================================================
# REDIS - CACHE DISTRIBUÍDO
# Redis não substitui o MySQL; ele guarda somente cópias temporárias de leituras.
# =============================================================================
spring.cache.type=${CACHE_TYPE:redis}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:sgt-local-redis}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:500ms}
spring.data.redis.timeout=${REDIS_COMMAND_TIMEOUT:500ms}

# TTLs das consultas realmente usadas pelo React.
app.cache.redis.ttl.painel=${REDIS_TTL_PAINEL:15m}
app.cache.redis.ttl.empregados-resumo=${REDIS_TTL_EMPREGADOS_RESUMO:90s}
app.cache.redis.ttl.empregados-frequencia=${REDIS_TTL_EMPREGADOS_FREQUENCIA:5m}
app.cache.redis.ttl.frequencias=${REDIS_TTL_FREQUENCIAS:2m}
app.cache.redis.ttl.http-get=${REDIS_TTL_HTTP_GET:45s}
app.cache.redis.http-get.enabled=${REDIS_HTTP_GET_ENABLED:true}
app.cache.redis.http-get.max-response-bytes=${REDIS_HTTP_GET_MAX_RESPONSE_BYTES:2097152}

# DEBUG mostra apenas os MISS; se a segunda chamada não gerar MISS, veio do Redis.
logging.level.com.example.siggtrat.servico.ConsultaCacheRedisServico=${REDIS_CACHE_LOG_LEVEL:INFO}

# =============================================================================
# RECUPERAÇÃO DE SENHA POR E-MAIL - GMAIL SMTP
# Credenciais ficam exclusivamente no ambiente Java. Nunca exponha a senha de
# aplicativo no React. Para Gmail, use senha de app (conta com 2 etapas ativa).
# =============================================================================
app.recuperacao-senha.token-minutos=${PASSWORD_RESET_TOKEN_MINUTES:20}
app.recuperacao-senha.intervalo-minimo-solicitacao-segundos=${PASSWORD_RESET_MIN_REQUEST_INTERVAL_SECONDS:60}
app.recuperacao-senha.frontend-url=${PASSWORD_RESET_FRONTEND_URL:http://localhost:5173}
app.recuperacao-senha.cleanup-cron=${PASSWORD_RESET_CLEANUP_CRON:0 30 3 * * ?}

app.email.gmail.enabled=${GMAIL_EMAIL_ENABLED:false}
app.email.gmail.usuario=${GMAIL_SMTP_USERNAME:}
app.email.gmail.remetente=${GMAIL_EMAIL_FROM:${GMAIL_SMTP_USERNAME:}}
app.email.gmail.nome-remetente=${GMAIL_EMAIL_FROM_NAME:SIG GTRAT - Correios}
app.email.gmail.logo-classpath=${GMAIL_EMAIL_LOGO_CLASSPATH:email/correios.png}

spring.mail.host=${GMAIL_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${GMAIL_SMTP_PORT:587}
spring.mail.username=${GMAIL_SMTP_USERNAME:}
spring.mail.password=${GMAIL_SMTP_APP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties[mail.smtp.auth]=${GMAIL_SMTP_AUTH:true}
spring.mail.properties[mail.smtp.starttls.enable]=${GMAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties[mail.smtp.starttls.required]=${GMAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties[mail.smtp.connectiontimeout]=${GMAIL_SMTP_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties[mail.smtp.timeout]=${GMAIL_SMTP_READ_TIMEOUT_MS:10000}
spring.mail.properties[mail.smtp.writetimeout]=${GMAIL_SMTP_WRITE_TIMEOUT_MS:10000}

# Exportações nacionais grandes são montadas em disco e depois transferidas pela resposta assíncrona.
# O padrão de 4 horas evita encerrar PDFs nacionais muito extensos; produção pode reduzir/aumentar via ENV.
spring.mvc.async.request-timeout=${RELATORIO_EXPORTACAO_TIMEOUT_MS:14400000}

# =============================================================================
# RELATÓRIOS GRANDES - ARQUIVO TEMPORÁRIO EM DISCO
# Cada PDF/XLSX nacional é montado no servidor em lotes de 5.000 registros.
# O arquivo concluído é enviado ao cliente e removido imediatamente. O TTL é
# apenas uma rede de segurança para sobras após encerramento abrupto da JVM.
# Se RELATORIO_TEMP_DIR ficar vazio, usa ${java.io.tmpdir}/sgt/relatorios.
# =============================================================================
app.relatorios.temp.diretorio=${RELATORIO_TEMP_DIR:}
app.relatorios.temp.ttl-ms=${RELATORIO_TEMP_TTL_MS:28800000}
app.relatorios.temp.cleanup-ms=${RELATORIO_TEMP_CLEANUP_MS:1800000}
app.relatorios.temp.cleanup-initial-delay-ms=${RELATORIO_TEMP_CLEANUP_INITIAL_DELAY_MS:300000}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}
