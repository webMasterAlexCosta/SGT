# Produção: validação sem geração/mutação de schema; provisão externa.
# validate verifica os aspectos suportados pelo Hibernate, não todo drift possível.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# PostgreSQL pode incluir a linha rejeitada em detalhes de erro: diagnóstico seguro próprio.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

# Modalidade inicial: HTTPS no Tomcat do próprio JAR, sem confiança em headers
# encaminhados por clientes. Proxy/TLS externo exige desenho e ensaio próprios.
server.ssl.enabled=true
server.forward-headers-strategy=none
# Cargas de instalação são uma etapa explícita anterior; não executar no serviço.
app.seed.usuarios-globais-enabled=false
app.seed.gestores-se-gestao-local-enabled=false
app.seed.unidades-operacionais-enabled=false
app.seed.jornadas-operacionais-enabled=false
# Encerramento normal permite concluir requests e transações em andamento.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
