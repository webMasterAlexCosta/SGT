# Perfil utilizado por JUnit/Spring Boot Test.
# A URL do banco pode ser substituída por @DynamicPropertySource/Testcontainers.

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.ssl.enabled=false

cors.allowed-origins=http://localhost:3000

jwt.secret=TestJwtSecret_123456789012345678901234567890123456789012345678901234567890
jwt.expiration=3600

app.security.autenticar.max-attempts=3
app.security.autenticar.block-duration-ms=1000
autenticar.attempt.cleanup-rate-ms=60000

app.security.jwt.max-inactivity-minutes=30
app.security.jwt.update-interval-seconds=120
app.security.jwt.cache-ttl-ms=30000
app.security.jwt.cache-cleanup-ms=300000
app.security.jwt.cleanup.cron=0 0 * * * ?
app.security.jwt.cleanup.batch-size=100
jwt.cleanup.retry-attempts=1
jwt.cleanup.retry-delay-ms=1

app.security.2fa.period-seconds=30

app.ratelimit.capacity=1000
app.ratelimit.duration-seconds=60
app.ratelimit.cleanup-rate-ms=3600000
app.ratelimit.timeout-ms=3600000

file.upload-dir=${java.io.tmpdir}/siggtrat-test/uploads
app.upload.max-file-size-bytes=10485760
app.upload.max-total-bytes=26214400
app.upload.max-files-per-request=5

# Proposta atual: sete datas civis para lançar e 72 horas para editar.
frequencia.janela-operacional-dias=7
frequencia.edicao-horas=72
frequencia.max-range-days=45
frequencia.max-batch-size=1000
ocorrencia.max-period-days=120

auth.password-min-length=6
auth.device-cookie-max-age-seconds=7200
auth.generic-error=Credenciais inválidas.
appuser.retroactive-unlock-hours=24
appuser.retroactive-unlock-days=7
empregado.max-jornada-minutes=480

audit.secret=test-audit-secret-with-at-least-32-characters
audit.fallback-log=${java.io.tmpdir}/audit_fallback_test.log
audit.payload.max-bytes=65536
audit.sensitive-fields-regex=(?i)^(password|senha|pass|token|authorization|secret|refreshToken|accessToken|jwt|chave|pix|apiKey|clientSecret)$
auditlog.queue.capacity=2000
auditlog.flush.batch-size=100
auditlog.flush.delay-ms=500
auditlog.flush.retry-attempts=1
auditlog.flush.retry-delay-ms=1

sistema.manutencao=false
sistema.previsao-retorno=

spring.jackson2.serialization.fail-on-empty-beans=false
spring.jackson2.time-zone=America/Sao_Paulo
logging.level.root=WARN
logging.level.com.example.siggtrat=INFO

# O contexto mínimo de persistência não usa cache. As classes dedicadas de
# integração de cache habilitam Redis real por propriedades próprias.
spring.cache.type=none

# O cache HTTP também é habilitado explicitamente nas integrações Redis reais.
app.cache.redis.http-get.enabled=false
